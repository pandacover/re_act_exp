[project]
name = "react-agent"
version = "0.1.0"
description = "A minimal LangGraph agent using Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent.py", "menu_policy.py"]
